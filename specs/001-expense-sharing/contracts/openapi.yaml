# FUTURE, NON-MVP PROPOSAL. This file is NOT the interface of the Swing application.
# The CIS 285 lab implements a local single-module application (simplified
# Architecture B, see docs/decisions.md); no server or REST API is built. The current
# contract is contracts/inbound-use-cases.md. This sketch is retained only as a
# starting point for a possible later server-hosted design (see contracts/README.md).
# It has not been updated to the lab rules (reviewer updates, receipt-with-submission,
# report status counts); the spec and inbound-use-cases.md take precedence.
openapi: 3.1.0
info:
  title: SplitSmart API (future, non-MVP proposal)
  version: 0.0.0-proposal
  description: >
    FUTURE, NON-MVP proposal of an HTTPS/JSON contract for a possible server-hosted
    SplitSmart and future web/mobile clients. Not implemented and not used by the
    Swing MVP. Group authorization would be enforced by the service for every
    protected operation. Expense-update notifications are in-app; verification and
    recovery messages would use an identity email adapter.
servers:
  - url: https://api.example.invalid/v1
security:
  - bearerAuth: []
tags:
  - name: Identity
  - name: Groups
  - name: Expenses
  - name: Balances
  - name: Payments
  - name: Reports
  - name: Notifications
paths:
  /accounts:
    post:
      tags: [Identity]
      security: []
      summary: Register an account and send verification email
      operationId: registerAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, displayName]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 1 }
                displayName: { type: string, minLength: 1 }
      responses:
        "202":
          description: Registration accepted; verification instructions sent when applicable
        "409":
          description: Email address already registered
        "400":
          $ref: "#/components/responses/BadRequest"
  /accounts/verification:
    post:
      tags: [Identity]
      security: []
      summary: Verify an email address using a single-use token
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "204": { description: Email verified }
        "400": { $ref: "#/components/responses/BadRequest" }
  /sessions:
    post:
      tags: [Identity]
      security: []
      summary: Sign in with a verified email and password
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, tokenType, expiresIn]
                properties:
                  accessToken: { type: string }
                  tokenType: { type: string, const: Bearer }
                  expiresIn: { type: integer, minimum: 1 }
        "401": { description: Invalid credentials or unverified account }
  /password-resets:
    post:
      tags: [Identity]
      security: []
      summary: Request password recovery
      operationId: requestPasswordReset
      description: Returns a uniform response to avoid account enumeration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202": { description: Request accepted with a non-enumerating response }
  /password-resets/complete:
    post:
      tags: [Identity]
      security: []
      summary: Complete password recovery with a single-use token
      operationId: completePasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { type: string, format: password, minLength: 1 }
      responses:
        "204": { description: Password changed }
        "400": { $ref: "#/components/responses/BadRequest" }
  /groups:
    get:
      tags: [Groups]
      summary: List groups accessible to the current account
      operationId: listGroups
      responses:
        "200":
          description: Groups of which the current account is an active member
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Group" }
    post:
      tags: [Groups]
      summary: Create a group
      operationId: createGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, currency]
              properties:
                name: { type: string, minLength: 1 }
                currency: { type: string, pattern: "^[A-Z]{3}$" }
      responses:
        "201":
          description: Group created; creator is a manager
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /groups/{groupId}/members:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    get:
      tags: [Groups]
      summary: List current group members and review roles
      operationId: listGroupMembers
      responses:
        "200":
          description: Current memberships visible to a current group member
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [accountId, role, reviewer]
                  properties:
                    accountId: { type: string, format: uuid }
                    role: { type: string, enum: [MANAGER, MEMBER] }
                    reviewer: { type: boolean }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Groups]
      summary: Add a member or designate a reviewer
      operationId: addGroupMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountId, role]
              properties:
                accountId: { type: string, format: uuid }
                role: { type: string, enum: [MANAGER, MEMBER] }
                reviewer: { type: boolean, default: false }
      responses:
        "201": { description: Membership created }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /groups/{groupId}/members/{accountId}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
      - name: accountId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Groups]
      summary: Remove a member
      operationId: removeGroupMember
      responses:
        "204": { description: Membership removed }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /groups/{groupId}/expenses:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    get:
      tags: [Expenses]
      summary: List expenses visible to current group members
      operationId: listExpenses
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [PENDING, APPROVED, REJECTED] }
      responses:
        "200":
          description: Expenses, optionally filtered by review state
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Expense" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Expenses]
      summary: Submit an expense for review
      operationId: submitExpense
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpenseSubmission" }
      responses:
        "201":
          description: Expense created in PENDING state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Expense" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /groups/{groupId}/expenses/{expenseId}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
      - name: expenseId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Expenses]
      summary: Read expense details and proposed shares
      operationId: getExpense
      responses:
        "200":
          description: Expense visible to a current group member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Expense" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /groups/{groupId}/receipts:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    post:
      tags: [Expenses]
      summary: Upload an optional receipt image
      operationId: uploadReceipt
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: JPEG or PNG image, at most 10 MiB
            encoding:
              file:
                contentType: image/jpeg, image/png
      responses:
        "201":
          description: Receipt stored privately for association with an expense
          content:
            application/json:
              schema:
                type: object
                required: [receiptId, mediaType]
                properties:
                  receiptId: { type: string, format: uuid }
                  mediaType: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /groups/{groupId}/receipts/{receiptId}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
      - name: receiptId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Expenses]
      summary: Read an authorized expense receipt image
      operationId: getReceipt
      responses:
        "200":
          description: Receipt image
          content:
            image/*:
              schema: { type: string, format: binary }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /groups/{groupId}/expenses/{expenseId}/decision:
    parameters:
      - $ref: "#/components/parameters/GroupId"
      - name: expenseId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Expenses]
      summary: Approve or reject a pending expense
      operationId: decideExpense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [APPROVE, REJECT] }
                reason: { type: string }
      responses:
        "200":
          description: Decision applied once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Expense" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: Expense is no longer pending }
  /groups/{groupId}/balances:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    get:
      tags: [Balances]
      summary: Read derived pairwise balances
      operationId: getBalances
      responses:
        "200":
          description: Current balances derived from approved expenses and confirmed payments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Balance" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /groups/{groupId}/payments:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    get:
      tags: [Payments]
      summary: List group payment history
      operationId: listPayments
      responses:
        "200":
          description: Payment records visible to current group members
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Payment" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Payments]
      summary: Record a pending payment
      operationId: recordPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipientId, amount, currency, date]
              properties:
                recipientId: { type: string, format: uuid }
                amount: { type: string, pattern: "^[0-9]+(\\.[0-9]+)?$" }
                currency: { type: string, pattern: "^[A-Z]{3}$" }
                date: { type: string, format: date }
      responses:
        "201":
          description: Payment recorded as pending; balance unchanged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /groups/{groupId}/payments/{paymentId}/confirmation:
    parameters:
      - $ref: "#/components/parameters/GroupId"
      - name: paymentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Payments]
      summary: Confirm receipt of a pending payment
      operationId: confirmPayment
      responses:
        "200":
          description: Payment confirmed and balance reduced exactly once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: Payment is not pending or no longer fits outstanding balance }
  /groups/{groupId}/reports:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    get:
      tags: [Reports]
      summary: Read expense, balance, and payment report
      operationId: getReport
      parameters:
        - name: startDate
          in: query
          required: true
          schema: { type: string, format: date }
        - name: endDate
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Inclusive date-range report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
        "400": { description: Invalid or reversed date range }
        "403": { $ref: "#/components/responses/Forbidden" }
  /notifications:
    get:
      tags: [Notifications]
      summary: List in-app notifications for the current account
      operationId: listNotifications
      responses:
        "200":
          description: Authorized notifications only
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Notification" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    GroupId:
      name: groupId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Invalid request or domain validation failure
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Caller is not authorized for this operation or group
    NotFound:
      description: Resource not found or not visible to the caller
  schemas:
    Group:
      type: object
      required: [groupId, name, currency]
      properties:
        groupId: { type: string, format: uuid }
        name: { type: string }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
    ExpenseSubmission:
      type: object
      required: [payerId, amount, currency, date, description, splitMethod, participants]
      properties:
        payerId: { type: string, format: uuid }
        amount: { type: string, pattern: "^[0-9]+(\\.[0-9]+)?$" }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        date: { type: string, format: date }
        description: { type: string, minLength: 1 }
        splitMethod: { type: string, enum: [EQUAL, PERCENTAGE] }
        participants:
          type: array
          minItems: 1
          items:
            type: object
            required: [accountId]
            properties:
              accountId: { type: string, format: uuid }
              percentage: { type: string, pattern: "^[0-9]+(\\.[0-9]+)?$" }
        receiptId: { type: string, format: uuid }
    Expense:
      type: object
      required: [expenseId, groupId, submitterId, payerId, amount, currency, date, description, splitMethod, status, shares]
      properties:
        expenseId: { type: string, format: uuid }
        groupId: { type: string, format: uuid }
        submitterId: { type: string, format: uuid }
        payerId: { type: string, format: uuid }
        amount: { type: string }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        date: { type: string, format: date }
        description: { type: string }
        splitMethod: { type: string, enum: [EQUAL, PERCENTAGE] }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        receiptId: { type: string, format: uuid }
        shares:
          type: array
          items:
            type: object
            required: [accountId, amount]
            properties:
              accountId: { type: string, format: uuid }
              amount: { type: string }
              percentage: { type: string }
    Balance:
      type: object
      required: [debtorId, creditorId, amount, currency]
      properties:
        debtorId: { type: string, format: uuid }
        creditorId: { type: string, format: uuid }
        amount: { type: string }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
    Payment:
      type: object
      required: [paymentId, payerId, recipientId, amount, currency, date, status]
      properties:
        paymentId: { type: string, format: uuid }
        payerId: { type: string, format: uuid }
        recipientId: { type: string, format: uuid }
        amount: { type: string }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        date: { type: string, format: date }
        status: { type: string, enum: [PENDING, CONFIRMED] }
        confirmedAt: { type: [string, "null"], format: date-time }
    Notification:
      type: object
      required: [notificationId, groupId, expenseId, submitterId, createdAt]
      properties:
        notificationId: { type: string, format: uuid }
        groupId: { type: string, format: uuid }
        expenseId: { type: string, format: uuid }
        submitterId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        readAt: { type: [string, "null"], format: date-time }
    Report:
      type: object
      required: [startDate, endDate, currency, expenseCount, expenseTotal, paymentCount, confirmedPaymentTotal, balances]
      properties:
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        expenseCount: { type: integer, minimum: 0 }
        expenseTotal: { type: string }
        paymentCount: { type: integer, minimum: 0 }
        confirmedPaymentTotal: { type: string }
        balances:
          type: array
          items: { $ref: "#/components/schemas/Balance" }
    Problem:
      type: object
      required: [title, status]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errors:
          type: array
          items: { type: string }
